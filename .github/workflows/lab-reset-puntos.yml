name: Lab reset puntos movil
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/lab_reset_puntos.py
      - .github/workflows/lab-reset-puntos.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/lab_reset_puntos.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dantix-vision-lab/index.html
          git diff --cached --quiet && echo sin-cambios && exit 0
          git commit -m "Lab: Reiniciar puntos visible en movil"
          git push
