name: Lab seccion precision

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/lab_precision.py
      - .github/workflows/lab-precision.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/lab_precision.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dantix-vision-lab/index.html dantix-vision-lab/sw.js
          git diff --cached --stat
          git commit -m "Lab v223: bloque de precision vs medidora industrial" || echo sin-cambios
          git push
