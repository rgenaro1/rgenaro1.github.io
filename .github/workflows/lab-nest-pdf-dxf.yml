name: Lab nest PDF QR y DXF

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/lab_nest_pdf_dxf.py
      - .github/workflows/lab-nest-pdf-dxf.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/lab_nest_pdf_dxf.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dantix-vision-lab/index.html dantix-vision-lab/sw.js
          git diff --cached --stat
          git commit -m "Lab v225: PDF manta+QR una hoja y DXF del acomodo" || echo sin-cambios
          git push
