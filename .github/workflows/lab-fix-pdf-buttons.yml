name: Lab fix PDF buttons QR-Manta

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/lab_fix_pdf_buttons.py
      - .github/workflows/lab-fix-pdf-buttons.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/lab_fix_pdf_buttons.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dantix-vision-lab/index.html dantix-vision-lab/sw.js
          git diff --cached --stat
          git commit -m "Lab v226: fix PDF reporte + QR-Manta (gesto descarga, nombre)" || echo sin-cambios
          git push
