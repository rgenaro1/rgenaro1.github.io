name: Copiar Dantix a lab
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/copy-lab.yml"
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Traer LAB v220 (no produccion)
        run: |
          set -euo pipefail
          mkdir -p dantix-vision-lab
          curl -fsSL -o dantix-vision-lab/index.html "https://raw.githubusercontent.com/rgenaro1/dantix-vision-lab/main/index.html"
          curl -fsSL -o dantix-vision-lab/sw.js "https://raw.githubusercontent.com/rgenaro1/dantix-vision-lab/main/sw.js"
          grep -o '<title>[^<]*' dantix-vision-lab/index.html | head -1
          wc -c dantix-vision-lab/index.html dantix-vision-lab/sw.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dantix-vision-lab/index.html dantix-vision-lab/sw.js
          git diff --cached --quiet && echo 'sin cambios' && exit 0
          git commit -m "Lab publico: v220 con home nuevo (no toca produccion)"
          git push
