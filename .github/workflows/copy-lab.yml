name: Copiar Dantix a lab
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/copy-lab.yml"
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copiar carpeta de producción a lab
        run: |
          set -euo pipefail
          mkdir -p dantix-vision-lab
          cp -f dantix-vision/index.html dantix-vision-lab/index.html
          cp -f dantix-vision/manifest.webmanifest dantix-vision-lab/manifest.webmanifest || true
          cp -f dantix-vision/sw.js dantix-vision-lab/sw.js || true
          cp -f dantix-vision/icon.svg dantix-vision-lab/icon.svg || true
          wc -c dantix-vision-lab/index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dantix-vision-lab
          git diff --cached --quiet && echo 'sin cambios' && exit 0
          git commit -m "Lab: copia v206 para probar sin tocar /dantix-vision/"
          git push
