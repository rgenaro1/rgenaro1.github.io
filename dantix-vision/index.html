<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dantix Leather Vision</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0d9d94">
  <link rel="apple-touch-icon" href="./icon.svg">
  <style>
    html,body{margin:0;height:100%;background:#0d9d94;color:#fff;font-family:system-ui,sans-serif}
    #boot{display:grid;place-items:center;height:100%;text-align:center;padding:24px}
  </style>
</head>
<body>
  <div id="boot">Cargando Dantix Leather Vision…</div>
  <script>
  (async function(){
    var N = 22, el = document.getElementById('boot');
    try {
      var parts = [];
      for (var i = 0; i < N; i++) {
        var name = './parts/p' + String(i).padStart(2,'0') + '.txt';
        var r = await fetch(name, {cache:'no-store'});
        if (!r.ok) throw new Error('No está ' + name + ' (' + r.status + ')');
        parts.push(await r.text());
        el.textContent = 'Cargando Dantix… ' + (i+1) + '/' + N;
      }
      var html = parts.join('');
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      el.innerHTML = 'No se pudo armar la app.<br><small>' + e.message + '</small>';
    }
  })();
  </script>
</body>
</html>
